[project]
name = "llm-master"
version = "2.0.0a0"
description = "Lite multi-provider LLM wrapper on any-llm"
requires-python = ">=3.11"
dependencies = [
    "any-llm-sdk[gemini]==1.38.0",
    # aiohttp transports for the SDKs any-llm drives
    "openai[aiohttp]",
    "anthropic[aiohttp]",
    "google-genai[aiohttp]",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# agent/, the tools beside llm_master: the sandbox and web search
agent = ["modal>=1.6.2", "exa-py>=2.25.0", "pydantic>=2.11", "pyyaml>=6.0.3"]
# server/, the backend on Modal
server = ["fastapi>=0.147.0"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-xdist", "llm-master[agent,server]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_master", "agent"]

[tool.uv.sources]
# 1.38.0 plus one fix until released: Gemini tool-result media without display_name or a $ref
any-llm-sdk = { git = "https://github.com/JamMaster1999/any-llm", branch = "llm-master" }
