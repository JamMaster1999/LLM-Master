[project]
name = "llm-master"
version = "2.0.0a0"
description = "Lite multi-provider LLM wrapper on any-llm"
requires-python = ">=3.11"
dependencies = [
    "any-llm-sdk[gemini]==1.37.0",
    # aiohttp transports for the SDKs any-llm drives
    "openai[aiohttp]",
    "anthropic[aiohttp]",
    "google-genai[aiohttp]",
]

[project.optional-dependencies]
# agent/, the tools beside llm_master: the sandbox and web search
agent = ["modal>=1.6.2", "exa-py>=2.25.0"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "llm-master[agent]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_master", "agent"]

[tool.uv.sources]
# until mozilla-ai/any-llm#1513, #1514 and #1515 are released: the three Gemini fixes, merged
any-llm-sdk = { git = "https://github.com/JamMaster1999/any-llm", branch = "llm-master" }
