[project]
name = "llm-master"
version = "2.0.0a0"
description = "Lite multi-provider LLM wrapper on any-llm"
requires-python = ">=3.11"
dependencies = [
    "any-llm-sdk[gemini]==1.37.0",
    # aiohttp transports for the SDKs any-llm drives
    "openai[aiohttp]",
    "anthropic[aiohttp]",
    "google-genai[aiohttp]",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_master"]

[tool.uv.sources]
# until mozilla-ai/any-llm#1513, #1514 and #1515 and fork PR #20 are released: the Gemini fixes, merged
any-llm-sdk = { git = "https://github.com/JamMaster1999/any-llm", branch = "llm-master" }
