# Lives here, not in pyproject: rootdir must be tests/ so pytest never treats the
# repo root (v1's __init__.py) as an importable package.
[pytest]
markers =
    live: hits real provider APIs, needs keys
    agentic: a real model drives a multi-step tool loop; minutes each, so they run only with -m agentic
asyncio_mode = auto
# -n auto runs tests in parallel (conftest picks how many); add -n0 to run one test alone. loadgroup
# keeps an xdist_group's tests on one worker, so they can share a fixture
addopts = --import-mode=importlib -n auto --dist loadgroup
