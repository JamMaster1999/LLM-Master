# Lives here, not in pyproject: rootdir must be tests/ so pytest never treats the
# repo root (v1's __init__.py) as an importable package. pythonpath lets the tests
# import cases.py, the candidates several of them send.
[pytest]
markers = live: hits real provider APIs, needs keys
asyncio_mode = auto
# -n auto runs tests in parallel (conftest picks how many); add -n0 to run one test alone
addopts = --import-mode=importlib -n auto
pythonpath = .
